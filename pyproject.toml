[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "kraus-mlst-experiments"
version = "1.0.0"
description = "Code to reproduce Kraus-constrained sequence learning for quantum trajectories"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24,<3",
  "pandas>=2.0,<3",
  "scipy>=1.10",
  "PyYAML>=6.0",
  "tqdm>=4.66",
  "torch>=2.1",
]

[tool.setuptools.packages.find]
include = ["kraus_mlst*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
