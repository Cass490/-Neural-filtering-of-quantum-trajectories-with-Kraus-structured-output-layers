# Tiny CPU configuration to check the pipeline end to end in a few minutes.
project_name: kraus_mlst_smoke
output_root: outputs/smoke
seeds: [1]

data:
  root: data/smoke
  workers: 0
  seed: 101
  counts:
    train: 12
    val: 4
    test: 4
  simulation:
    n_qubits: 1
    steps: 32
    dt: 0.01
    initial_state: random_pure
    dynamics:
      omega: [0.5, 1.5]
      kappa: [0.2, 0.5]
      eta: [0.8, 1.0]
      coupling: 0.0
      switching:
        n_switches: 1
        low: 8
        high: 24
        axes: [x, y]
        resample_kappa: true
      drift:
        enabled: false
      colored_hamiltonian_noise:
        enabled: false
      amplitude_damping: 0.0
      extra_dephasing: 0.0
    readout_noise:
      white_std: 0.0
      ou_std: 0.0
  ood_scenarios:
    eta_06:
      count: 4
      dynamics:
        eta: 0.6

model:
  rank: 2
  backbone_cfg:
    hidden_dim: 16
    layers: 1
    tcn_layers: 2
    d_state: 16
  head_cfg:
    residual_scale: 0.1

training:
  device: cpu
  deterministic: true
  epochs: 1
  window: 16
  windows_per_trajectory: 1
  val_windows_per_trajectory: 1
  batch_size: 4
  gradient_accumulation: 1
  num_workers: 0
  learning_rate: 0.001
  weight_decay: 0.0
  grad_clip: 1.0
  lr_factor: 0.5
  lr_patience: 2
  max_train_batches: 2
  max_val_batches: 1
  full_rollout_finetune_epochs: 1
  full_rollout_train_trajectories: 4
  full_rollout_val_trajectories: 2
  full_rollout_batch_size: 2
  full_rollout_gradient_accumulation: 1
  full_rollout_learning_rate: 0.0005

evaluation:
  batch_size: 2

loss:
  soft_lambdas:
    trace: 1.0
    psd: 1.0
    hermiticity: 0.25
  choi_tp_lambda: 1.0

experiments:
  core:
    backbones: [gru, tcn]
    variants: [direct_rho0, recursive, soft, cholesky, choi, kraus]
    variants_by_backbone:
      gru: [direct_legacy, direct_rho0, recursive, soft, cholesky, choi, kraus]
    ranks: [2]
    seeds: [1, 2]
    allow_optional_skip: false
  soft_sweep:
    backbones: [gru]
    variants: [soft]
    ranks: [2]
    seeds: [1, 2]
    soft_profiles:
      strong:
        soft_lambdas: {trace: 10.0, psd: 10.0, hermiticity: 2.5}
    allow_optional_skip: false

sme_baselines:
  scenarios: [id]
  max_trajectories: 2
  mismatched:
    omega: 1.0
    kappa: 0.35
    eta: 0.8
    axis: x
  adaptive:
    enabled: true
    omega_grid: [0.5, 1.0, 1.5]
    kappa_grid: [0.2, 0.35, 0.5]
    eta: 0.8
    axes: [x, y]
    transition_mix: 0.01

benchmark:
  batch_sizes: [1, 2]
  warmup: 1
  repeats: 2

numerical_audit:
  max_trajectories: 2

aggregation:
  core_scenario: id
  main_variants: [recursive, soft, cholesky, choi, kraus]
